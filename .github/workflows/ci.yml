name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Import check (API app)
        run: python -c "import src.app.api; print('api import OK')"

      - name: Import check (Streamlit app)
        run: python -c "import src.app.streamlit_app; print('streamlit import OK')"

      - name: Run tests
        env:
          GROQ_API_KEY: "dummy-for-ci"
        run: pytest -q
